name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: main.exe
            asset_name: app-windows.exe
          - os: macos-latest
            artifact_name: main
            asset_name: app-macos
          - os: ubuntu-latest
            artifact_name: main
            asset_name: app-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.1.3"

      - name: Install dependencies
        run: poetry install
        shell: bash
      
      - name: Build with PyInstaller
        run: |
          poetry run pyinstaller main.spec
          ls -la dist/
        shell: bash
      
      - name: Rename binary
        run: |
          echo "Files in dist:"
          ls -la dist/
          
          if [ -f "dist/${{ matrix.artifact_name }}" ]; then
            mv "dist/${{ matrix.artifact_name }}" "dist/${{ matrix.asset_name }}"
          else
            echo "Expected file not found. Trying to find executable..."
            find dist/ -type f -executable
          fi
        shell: bash
      
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          fail_on_unmatched_files: false