name: CI

on: [push, pull_request]

jobs:
  build-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -e .
      - run: pip install pyinstaller
      - run: pyinstaller main.spec
      - run: dir dist\PDF2Book