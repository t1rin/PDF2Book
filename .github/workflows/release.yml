name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: main.exe
            asset_name: app-windows.exe
          - os: macos-latest
            artifact_name: main
            asset_name: app-macos
          - os: ubuntu-latest
            artifact_name: main
            asset_name: app-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: python -m pip install --upgrade pip
      - run: pip install pyinstaller
      - run: pyinstaller main.spec
      - name: Rename binary
        shell: bash
        run: |
          if [ -f "dist/${{ matrix.artifact_name }}" ]; then
            mv "dist/${{ matrix.artifact_name }}" "dist/${{ matrix.asset_name }}"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}