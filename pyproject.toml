[project]
name = "pdf2book"
version = "2.0"
description = ""
authors = [
    {name = "t1rin"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dearpygui (>=2.3.1,<3.0.0)",
    "pymupdf (>=1.28.2,<2.0.0)",
    "pywin32 (>=312,<313) ; sys_platform == \"win32\"",
    "mypy (>=2.3.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
packages = [
    { include = "core" },
    { include = "ui" },
    { include = "utils" },
]


[tool.mypy]
[[tool.mypy.overrides]]
module = ["dearpygui.*", "ui.DearPyGui_DragAndDrop.*"]
ignore_missing_imports = true
ignore_errors = true